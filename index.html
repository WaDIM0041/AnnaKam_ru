  function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;"); }

<script>
/* Hover ссылок: текст принимает цвет подчеркивания/акцента ссылки. */
(function(){
  function hexOf(style){
    var m = /#[0-9a-fA-F]{6}|#[0-9a-fA-F]{3}/.exec(style || "");
    return m ? m[0] : null;
  }
  function accentOf(a){
    var spans = a.querySelectorAll("span");
    for (var k = 0; k < spans.length; k++){
      var st = spans[k].getAttribute("style") || "";
      if (st.indexOf("background") > -1){
        var hex = hexOf(st);
        if (hex) return hex;
      }
    }
    return null;
  }
  function bind(a){
    if (a.getAttribute("data-akhover") === "1") return;
    var hex = accentOf(a);
    if (!hex) return;
    a.setAttribute("data-akhover", "1");
    a.addEventListener("mouseenter", function(){ a.style.setProperty("color", hex, "important"); });
    a.addEventListener("mouseleave", function(){ a.style.removeProperty("color"); });
  }
  function apply(){
    var nodes = document.querySelectorAll("header a.group, footer a.group");
    for (var k = 0; k < nodes.length; k++) bind(nodes[k]);
    return nodes.length > 0;
  }
  function watch(){
    if (!window.MutationObserver) return;
    new MutationObserver(function(){ apply(); }).observe(document.body, { childList: true, subtree: true });
  }
  function init(){
    if (apply()){ watch(); return; }
    var iv = setInterval(function(){ if (apply()){ clearInterval(iv); watch(); } }, 400);
    setTimeout(function(){ clearInterval(iv); }, 20000);
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script></body></html>
