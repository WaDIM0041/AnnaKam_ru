<script>
(function(){
  var TARGET = "получить новых клиентов";
  function pick(el){
    while(el && el!==document.body){
      var cl=(el.className||'');
      if(typeof cl==='string' && cl.indexOf('showcase-glow-border')>-1) return el;
      el=el.parentElement;

  function apply(){

      }

  }

  }
})();
